{% extends 'auth_base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="brand">
        <i class="fas fa-lock text-danger"></i>
        <h4>Admin Login</h4>
        <p>System administrators only.</p>
    </div>
    <form method="POST">
        <div class="form-group mb-3">
            <label class="small font-weight-bold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="admin" required>
        </div>
        <div class="form-group mb-4">
            <label class="small font-weight-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-danger btn-auth text-white" style="background:#ef4444;border:none;">Sign
            In</button>
    </form>
    <p class="text-center small text-muted mt-4 mb-0">
        <a href="{{ url_for('home') }}" class="text-secondary"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a>
    </p>
</div>
{% endblock %}
