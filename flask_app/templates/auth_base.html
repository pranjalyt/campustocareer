<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Login{% endblock %} | Campus to Career</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            animation: fadeInCard 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .auth-card .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-card .brand i {
            font-size: 2.5rem;
            color: #4361ee;
        }

        .auth-card .brand h4 {
            font-weight: 700;
            color: #1e293b;
            margin-top: 8px;
        }

        .auth-card .brand p {
            color: #64748b;
            font-size: .9rem;
            margin: 0;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
        }

        .form-control:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, .15);
        }

        .btn-auth {
            background: #4361ee;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
        }

        .btn-auth:hover {
            background: #3f37c9;
        }

        .flash-wrap {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            min-width: 280px;
        }

        .input-group-text {
            border-radius: 0 8px 8px 0;
            background: #f8fafc;
            border-left: none;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="flash-wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show shadow" role="alert">
            {{ msg }}<button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
        </div>
        {% endfor %}
        {% endwith %}
    </div>
    {% block content %}{% endblock %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script>setTimeout(() => $('.alert').fadeOut(), 4000)</script>
</body>

</html>
