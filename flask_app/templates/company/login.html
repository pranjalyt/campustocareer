{% extends 'auth_base.html' %}
{% block title %}Company Login{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="brand">
        <i class="fas fa-building text-success"></i>
        <h4>Company Login</h4>
        <p>Sign in to post jobs and manage applications.</p>
    </div>
    <form method="POST">
        <div class="form-group mb-3">
            <label class="small font-weight-bold">Company Email</label>
            <input type="email" name="email" class="form-control" placeholder="hr@company.com" required>
        </div>
        <div class="form-group mb-3">
            <label class="small font-weight-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label small text-muted" for="remember">Remember me</label>
            </div>
            <a href="{{ url_for('company_forgot') }}" class="small text-success">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-success btn-auth text-white" style="background:#10b981;border:none;">Sign
            In</button>
    </form>
    <hr>
    <p class="text-center small text-muted mb-0">
        New employer? <a href="{{ url_for('company_register') }}" class="text-success font-weight-bold">Register
            Company</a>
    </p>
    <p class="text-center small text-muted mt-2 mb-0">
        <a href="{{ url_for('home') }}" class="text-secondary"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a>
    </p>
</div>
{% endblock %}
