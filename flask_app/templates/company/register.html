{% extends 'auth_base.html' %}
{% block title %}Company Registration{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:600px;">
    <div class="brand">
        <i class="fas fa-building text-success"></i>
        <h4>Register Company</h4>
        <p>Create your employer profile and start hiring.</p>
    </div>
    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Company Name</label>
                <input type="text" name="company_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Contact Person</label>
                <input type="text" name="contact_person" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Company URL</label>
                <input type="text" name="company_url" class="form-control" placeholder="www.example.com">
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Mobile Number</label>
                <input type="number" name="mobile" class="form-control" required>
            </div>
            <div class="col-md-12 mb-3">
                <label class="small font-weight-bold">Office Address</label>
                <input type="text" name="address" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Company Email (Login ID)</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
        </div>
        <button type="submit" class="btn btn-success btn-auth text-white mt-2"
            style="background:#10b981;border:none;">Register</button>
    </form>
    <hr>
    <p class="text-center small text-muted mb-0">
        Already registered? <a href="{{ url_for('company_login') }}" class="text-success font-weight-bold">Sign In</a>
    </p>
    <p class="text-center small text-muted mt-2 mb-0">
        <a href="{{ url_for('home') }}" class="text-secondary"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a>
    </p>
</div>
{% endblock %}
