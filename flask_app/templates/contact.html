{% extends 'base.html' %}
{% block title %}Contact Us | Campus to Career{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 mb-5">
                <h2 class="font-weight-bold mb-2">Get In Touch</h2>
                <div class="bg-primary rounded mb-4" style="width:60px;height:4px;"></div>
                {% if page %}
                <div class="mb-4">
                    <p><i class="fas fa-map-marker-alt text-primary mr-2"></i>{{ page.PageDescription }}</p>
                    <p><i class="fas fa-phone text-primary mr-2"></i>+{{ page.MobileNumber }}</p>
                    <p><i class="fas fa-envelope text-primary mr-2"></i>{{ page.Email }}</p>
                </div>
                {% endif %}
                <form method="POST">
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-control" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <textarea class="form-control" rows="5" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary px-5">Send Message</button>
                </form>
            </div>
            <div class="col-lg-6">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224097.58141849373!2d77.06889754863281!3d28.527554792869!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cfd5b347eb62d%3A0x37205b715389640!2sNew%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1708163892345!5m2!1sen!2sin"
                    width="100%" height="450" style="border:0;border-radius:12px;" allowfullscreen
                    loading="lazy"></iframe>
            </div>
        </div>
    </div>
</section>
{% endblock %}
