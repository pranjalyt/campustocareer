{% extends 'auth_base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="brand">
        <i class="fas fa-envelope-open-text text-primary"></i>
        <h4>Reset Password</h4>
        <p>Enter your email to receive a reset link.</p>
    </div>
    <form method="POST">
        <div class="form-group mb-4">
            <label class="small font-weight-bold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-auth text-white">Send Reset Link</button>
    </form>
    <p class="text-center small text-muted mt-4 mb-0">
        Remembered?
        {% if 'user' in request.path %}
        <a href="{{ url_for('user_login') }}" class="text-primary font-weight-bold">Sign In</a>
        {% else %}
        <a href="{{ url_for('company_login') }}" class="text-primary font-weight-bold">Sign In</a>
        {% endif %}
    </p>
</div>
{% endblock %}
