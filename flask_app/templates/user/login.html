{% extends 'auth_base.html' %}
{% block title %}User Login{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="brand">
        <i class="fas fa-user-circle"></i>
        <h4>Student Login</h4>
        <p>Welcome back! Please sign in to continue.</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="small font-weight-600" style="font-weight:600;">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label class="small font-weight-600" style="font-weight:600;">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label small text-muted" for="remember">Remember me</label>
            </div>
            <a href="{{ url_for('user_forgot') }}" class="small text-primary">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-auth text-white">Sign In</button>
    </form>
    <hr>
    <p class="text-center small text-muted mb-0">
        Don't have an account? <a href="{{ url_for('user_register') }}" class="text-primary font-weight-bold">Sign
            Up</a>
    </p>
    <p class="text-center small text-muted mt-2 mb-0">
        <a href="{{ url_for('home') }}" class="text-secondary"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a>
    </p>
</div>
{% endblock %}
