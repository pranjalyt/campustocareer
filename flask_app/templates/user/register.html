{% extends 'auth_base.html' %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:520px;">
    <div class="brand">
        <i class="fas fa-user-plus"></i>
        <h4>Create Student Account</h4>
        <p>Join thousands of students finding their dream jobs.</p>
    </div>
    <form method="POST">
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="small font-weight-bold">Full Name</label>
                <input type="text" name="fullname" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="col-md-12 mb-3">
                <label class="small font-weight-bold">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Mobile Number</label>
                <input type="number" name="mobile" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Student ID</label>
                <input type="text" name="studentid" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Gender</label>
                <select name="gender" class="form-control" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="small font-weight-bold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth text-white mt-2">Sign Up</button>
    </form>
    <hr>
    <p class="text-center small text-muted mb-0">
        Already have an account? <a href="{{ url_for('user_login') }}" class="text-primary font-weight-bold">Sign In</a>
    </p>
    <p class="text-center small text-muted mt-2 mb-0">
        <a href="{{ url_for('home') }}" class="text-secondary"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a>
    </p>
</div>
{% endblock %}
